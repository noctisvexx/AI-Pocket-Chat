name: Sync Upstream and Build APK

on:
  workflow_dispatch:
  schedule:
    # Every day at 10:00 JST (01:00 UTC)
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/marlon0066/AI-Pocket-Chat.git
          git fetch upstream main

          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "No upstream changes."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream has new commits. Merging upstream/main..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep fork-specific commits. If upstream and fork conflict,
          # fail instead of silently overwriting local changes.
          git merge upstream/main --no-edit

          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.sync.outputs.updated == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.sync.outputs.updated == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        if: steps.sync.outputs.updated == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Read app version
        if: steps.sync.outputs.updated == 'true'
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$APK" "AI-Pocket-Chat-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK artifact
        if: steps.sync.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Pocket-Chat-release
          path: AI-Pocket-Chat-v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version_name }}-${{ github.run_number }}"
          gh release create "$TAG" "AI-Pocket-Chat-v${{ steps.version.outputs.version_name }}.apk" \
            --title "AI-Pocket-Chat v${{ steps.version.outputs.version_name }} (build ${{ github.run_number }})" \
            --notes "Automated APK build from upstream sync.\n\n- Version: ${{ steps.version.outputs.version_name }}\n- Version code: ${{ steps.version.outputs.version_code }}\n- Build: ${{ github.run_number }}"