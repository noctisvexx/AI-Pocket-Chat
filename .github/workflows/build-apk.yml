name: Build and Release APK

# ─────────────────────────────────────────────────────────────────────────────
# 唯一的构建发布入口：手动触发 + 每天自动同步上游。
#
# 为什么把原来的两个 workflow 合并成一个：
#
#   1. tag 必然撞车。原来 build-apk.yml 和 sync-upstream.yml 各自构建、各自发布，
#      而 github.run_number 是「每个 workflow 独立计数」的序列。两个序列都从 1
#      起步，必然重名。又因为 app/build.gradle.kts 里 versionName 恒为 "0.1.0"、
#      versionCode 恒为 1，tag 唯一性 100% 依赖 run_number —— 所以 sync 的
#      Create GitHub Release 从 9/9 起一直在失败，tag 名（v0.1.0-2、v0.1.0-3）
#      早就被 build-apk 占掉了。
#
#   2. 两个 workflow 出的包根本不是同一种包。sync-upstream.yml 完全没有签名步骤，
#      出的是 runner 临时 debug 密钥签的包；build-apk.yml 有正式签名。两者签名
#      不同，手机上互相覆盖不了 —— 这正是「每次更新都得先卸载」的原因。
#      而且 sync 版剔了 sherpa AAR、build-apk 版没剔，包内容也不一样。
#
# 合并之后：只有一条 run_number 序列（tag 不再撞），签名逻辑只有一份，
# 所有发布出来的 APK 都是同一个密钥、同样的构建参数。
#
# ── 发布策略 ─────────────────────────────────────────────────────────────────
# 每次构建会写两个 release：
#
#   1. 「latest」固定入口 —— tag 固定、asset 名固定（不带版本号），每次构建覆盖。
#      下载链接永远不变，手机存这一个书签就够：
#        https://github.com/<owner>/<repo>/releases/latest/download/AI-Pocket-Chat.apk
#      同时被标为 Latest，所以 /releases/latest 也会重定向到这里。
#
#   2. 带 build 号的历史归档（如 v0.1.0-23）—— 需要回滚旧版本时用。
#      不想要它的话，把最后那段「历史归档」删掉即可，固定入口不受影响。
#
# 首次使用前必须先配好 4 个仓库 secret（Settings -> Secrets and variables -> Actions）：
#   ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# 还没有 keystore 的话，先手动跑一次 generate-keystore.yml 生成。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '构建前先同步上游 marlon0066/AI-Pocket-Chat（上游无变化则跳过构建）'
        type: boolean
        default: true

  schedule:
    # 每天 01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'

permissions:
  contents: write

# 这里刻意不写 concurrency。
#
# GitHub 的 concurrency 是按 group 名串行的：同一 group 里只要有 run 还挂在
# 「排队」状态，后面的 run 就永远不会开始。而 GitHub 有个已知的后端问题
# （2026-09 社区仍有报告）：run 和 check-suite 在 metadata 层创建了，调度器却
# 没拿到 workload —— 表现就是 status=queued、jobs=0、check-runs=0、
# updated_at 永远不动。这种「孤儿记录」在页面上去不掉，取消还会返回 500/409。
#
# 一旦出现一次，它会把同名 group 后面所有 run 全部堵死 —— 而且是静默的，
# 页面上只显示 Queued，看不出任何原因。不写 concurrency，这种记录就是惰性的，
# 不消耗额度也不挡新 run，等 GitHub 自己清理即可。
#
# 那并发怎么办？这里本来就不需要防：tag 用的是 ${{ github.run_number }}，
# 两个并发 run 的编号天然不同，不会重名；后面还额外做了 tag 存在性检查和
# release 幂等处理。手动和定时撞上的概率本来也低，不值得为此换一个死锁风险。

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能做 upstream merge。
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        # 定时触发一律同步；手动触发时看 sync_upstream 开关。
        if: github.event_name == 'schedule' || inputs.sync_upstream == true
        shell: bash
        run: |
          set -euo pipefail

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/marlon0066/AI-Pocket-Chat.git
          fi
          git fetch upstream main

          # 判断「上游是否真有新东西」，不能拿 HEAD 和 upstream/main 直接比：
          # 本 fork 有自己的提交（改过的 workflow、删掉的 sync-upstream.yml），
          # 两者永远不相等 —— 那样写会让这个跳过分支永远不生效，变成「上游半年
          # 没动也天天重新构建、天天发一个内容一模一样的 release」。
          # 正确问法是：上游最新提交是不是已经是 HEAD 的祖先。
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游无新提交，跳过本次构建。"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "上游有新提交，合并 upstream/main ..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 保留 fork 自己的提交；真冲突就失败退出，不静默覆盖本地改动。
          git merge upstream/main --no-edit

          # 构建期间若有人（或网页端）改动了 main，直接推会被拒 "fetch first"。
          # rebase 后再试一次，别让整次构建因为这个时序问题白跑。
          if ! git push origin HEAD:main; then
            echo "推送被拒绝（main 期间有新的提交），rebase 后重试一次。"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.sync.outputs.updated != 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.sync.outputs.updated != 'false'
        uses: gradle/actions/setup-gradle@v5

      - name: Configure persistent release signing
        if: steps.sync.outputs.updated != 'false'
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 逐个点名缺失的 secret。旧版只对 ANDROID_KEYSTORE_B64 有提示，
          # 其余任一缺失都只留下 "Process completed with exit code 1."，
          # 得翻整段日志才看得出缺什么。
          missing=()
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ];      then missing+=("ANDROID_KEYSTORE_B64"); fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then missing+=("ANDROID_KEYSTORE_PASSWORD"); fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ];         then missing+=("ANDROID_KEY_ALIAS"); fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ];      then missing+=("ANDROID_KEY_PASSWORD"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=缺少仓库 secret::请到 Settings -> Secrets and variables -> Actions 补齐：${missing[*]}"
            exit 1
          fi

          mkdir -p "$HOME/keystores"

          # 分开判断 base64 解码失败与「解出来是空文件」—— 两者修法完全不同。
          if ! printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/keystores/apc-release.jks" 2>/dev/null; then
            echo "::error title=ANDROID_KEYSTORE_B64 不是合法 base64::请用单行重新生成（Linux: base64 -w0 apc-release.jks / Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes('apc-release.jks'))），并确认粘贴时没混入 -----BEGIN 之类的头尾行。"
            exit 1
          fi
          if [ ! -s "$HOME/keystores/apc-release.jks" ]; then
            echo "::error title=keystore 解出来是空文件::ANDROID_KEYSTORE_B64 的值可能是空的或没粘贴完整。"
            exit 1
          fi

          cat > keystore.properties <<EOF
          storeFile=$HOME/keystores/apc-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties "$HOME/keystores/apc-release.jks"

          # 用 keytool 真正验一次：过滤掉「密码打错」「alias 名字不对」这两种最常见的手滑。
          if ! keytool -list -keystore "$HOME/keystores/apc-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=keystore 校验不通过::ANDROID_KEYSTORE_PASSWORD 错误，或 ANDROID_KEY_ALIAS 在该 keystore 中不存在。本地执行 keytool -list -keystore apc-release.jks 可列出真实 alias。"
            exit 1
          fi
          echo "Release signing ready (alias=$ANDROID_KEY_ALIAS)"

      - name: Configure lean release build
        if: steps.sync.outputs.updated != 'false'
        shell: bash
        run: |
          set -euo pipefail

          # Release APK 只保留 arm64-v8a。正则不写死具体 ABI 组合，
          # 上游加减 ABI 或换写法都能覆盖。
          sed -i -E 's/abiFilters \+= listOf\("[^"]*"(, "[^"]*")*\)/abiFilters += listOf("arm64-v8a")/' app/build.gradle.kts

          # sed 静默失效时 APK 会悄悄变大，所以回读确认：只要还有「非注释行同时含 abiFilters
          # 与 x86_64」，就说明 replace 没咬住（上游改了写法），必须显式告警。
          if grep -v '^[[:space:]]*//' app/build.gradle.kts | grep -qE 'abiFilters.*x86_64'; then
            echo "::warning title=ABI 精简未生效::app/build.gradle.kts 里仍有同时含 abiFilters 与 x86_64 的有效代码行，sed 没匹配上（上游可能改了写法），本次 APK 会包含 x86_64。"
          fi

          # 本 fork 关掉端侧 STT：保留 no-op 的 SttEngine，从 release classpath 里剔掉 sherpa AAR。
          # 版本号同样不写死，避免上游升级 sherpa（改文件名）后被静默漏掉。
          sed -i -E '/^[[:space:]]*(implementation|api)\(files\("libs\/sherpa[^"]*\.aar"\)\)/d' app/build.gradle.kts
          if grep -qE '^[[:space:]]*(implementation|api)\(files\("libs/sherpa[^"]*\.aar"\)\)' app/build.gradle.kts; then
            echo "::warning title=STT 剔除未生效::仍存在 sherpa AAR 依赖行，本次 APK 会重新打入端侧 STT。"
          fi

          grep -A3 'ndk {' app/build.gradle.kts | head -n 4

      - name: Build release APK
        if: steps.sync.outputs.updated != 'false'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK is release-signed
        if: steps.sync.outputs.updated != 'false'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          # set -u 下直接引用未定义的 $ANDROID_HOME 会让这一步以「未绑定变量」失败，先兜一层。
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error title=找不到 Android SDK::ANDROID_HOME 与 ANDROID_SDK_ROOT 均未设置。"
            exit 1
          fi
          "$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Read app version
        if: steps.sync.outputs.updated != 'false'
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        if: steps.sync.outputs.updated != 'false'
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$APK" "AI-Pocket-Chat-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK artifact
        if: steps.sync.outputs.updated != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Pocket-Chat-release
          path: AI-Pocket-Chat-v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to releases
        if: steps.sync.outputs.updated != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 关键：必须显式指定仓库，不能让 gh 自己猜。
          # Sync upstream 步骤加了一条指向 marlon0066/AI-Pocket-Chat 的 remote，而
          # gh CLI 在 git 仓库里会按 remote 自动推断"当前仓库"——结果推断到了上游，
          # 拿本仓库的 token 去操作别人的仓库，报
          #   403 Resource not accessible by integration
          #   (api.github.com/repos/marlon0066/AI-Pocket-Chat/releases)
          # 显式给出 GH_REPO 后，gh 一律以本 fork 为目标。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          APK_FILE="AI-Pocket-Chat-v${VERSION_NAME}.apk"

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          Automated ARM64-only APK build (upstream sync + manual trigger).

          - Version: ${VERSION_NAME}
          - Version code: ${VERSION_CODE}
          - Build: ${GITHUB_RUN_NUMBER}
          - Commit: ${GITHUB_SHA}
          - ABI: arm64-v8a only
          - Bundled STT model: removed
          - BGE semantic memory: retained
          - Release signing: persistent repository key
          EOF

          # ── ① 固定入口 release ───────────────────────────────────────────
          # 所有构建都写进同一个 tag=latest 的 release，asset 名也不带版本号，
          # 于是下载链接永远不变（手机存这一个书签就够，每次自动指向最新版）：
          #   https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/AI-Pocket-Chat.apk
          # 同时把它标为 Latest，所以 /releases/latest 也重定向到这里。
          #
          # 注意 asset 名刻意不带版本号：versionName 一直是 0.1.0，带上也区分不了，
          # 反而会让链接失效。
          ROLLING_TAG="latest"
          ROLLING_ASSET="AI-Pocket-Chat.apk"
          ROLLING_TITLE="AI-Pocket-Chat 最新版（v${VERSION_NAME} · build ${GITHUB_RUN_NUMBER}）"

          cp "$APK_FILE" "$ROLLING_ASSET"

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release upload "$ROLLING_TAG" "$ROLLING_ASSET" --clobber
            gh release edit "$ROLLING_TAG" \
              --title "$ROLLING_TITLE" --notes-file "$NOTES_FILE" --latest
            echo "已更新固定 release：$ROLLING_TAG（$ROLLING_ASSET）"
          else
            gh release create "$ROLLING_TAG" "$ROLLING_ASSET" \
              --title "$ROLLING_TITLE" --notes-file "$NOTES_FILE" --latest
            echo "已创建固定 release：$ROLLING_TAG（$ROLLING_ASSET）"
          fi

          # ── ② 历史归档 release ──────────────────────────────────────────
          # 每次构建另建一个带 build 号的 release，方便回滚到旧版本。
          # 不想要这份归档的话，把下面这一整段删掉即可，固定入口不受影响。
          TAG="v${VERSION_NAME}-${GITHUB_RUN_NUMBER}"

          # 双保险：versionName 恒为 0.1.0、versionCode 恒为 1，tag 唯一性全靠 run_number。
          # 万一这个 tag 名已被历史 run 占用，追加 run_id 让它一定唯一，而不是让整次构建白跑。
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            OLD_TAG="$TAG"
            TAG="${TAG}-${GITHUB_RUN_ID}"
            echo "::warning title=tag 已被占用::${OLD_TAG} 已存在，本次改用 ${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
            echo "已更新归档 release：$TAG"
          else
            # --latest=false：别把固定 release 的 Latest 标记抢走。
            gh release create "$TAG" "$APK_FILE" \
              --title "AI-Pocket-Chat v${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})" \
              --notes-file "$NOTES_FILE" --latest=false
            echo "已创建归档 release：$TAG"
          fi
