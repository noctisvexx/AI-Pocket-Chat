name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure persistent release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_B64 repository secret"; exit 1; }
          mkdir -p "$HOME/keystores"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/keystores/apc-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$HOME/keystores/apc-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties "$HOME/keystores/apc-release.jks"
          keytool -list -keystore "$HOME/keystores/apc-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Configure release ABI
        shell: bash
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("arm64-v8a")/' app/build.gradle.kts
          grep -A3 'ndk {' app/build.gradle.kts | head -n 4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK is release-signed
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$APK" "AI-Pocket-Chat-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Pocket-Chat-release
          path: AI-Pocket-Chat-v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-${{ github.run_number }}
          name: AI-Pocket-Chat v${{ steps.version.outputs.version_name }} (build ${{ github.run_number }})
          body: |
            Manual ARM64-only APK build from commit ${{ github.sha }}.

            - Version: ${{ steps.version.outputs.version_name }}
            - Version code: ${{ steps.version.outputs.version_code }}
            - Build: ${{ github.run_number }}
            - ABI: arm64-v8a only
            - Bundled STT model: removed
            - BGE semantic memory: retained
            - Release signing: persistent repository key
          files: AI-Pocket-Chat-v*.apk
          generate_release_notes: true
          prerelease: false
