name: Generate release keystore (run once)

# ─────────────────────────────────────────────────────────────────────────────
# 一次性工具：在 runner 上生成 Android 发布签名密钥。
#
# 为什么需要它：GitHub runner 的 debug 签名密钥是每次构建临时生成的，所以每个
# APK 的签名都不一样 —— 手机上想更新就必须先卸载旧版。只有用固定密钥做正式
# 签名，才能像正常 App 那样覆盖安装、保留应用数据。
#
# 跑完产物全部进私有 artifact（只有仓库有权限的人能下载），日志里不打印口令。
#
# 用法：
#   1. Actions 页面选 "Generate release keystore" -> Run workflow
#   2. 跑完下载 artifact "apc-release-keystore"
#   3. 到 Settings -> Secrets and variables -> Actions 新建 4 个 secret，值取自 artifact：
#        ANDROID_KEYSTORE_B64      <- apc-release.jks.b64 的全部内容（一整行）
#        ANDROID_KEYSTORE_PASSWORD <- STORE_PASSWORD.txt 的内容
#        ANDROID_KEY_ALIAS         <- apc-release
#        ANDROID_KEY_PASSWORD      <- STORE_PASSWORD.txt 的内容（和上面一样）
#   4. 想清楚后再删本文件、删掉 artifact，keystore 原件自己另存一份。
#
# ⚠️ keystore 原件务必自己留档备份。它一旦丢失，就再也无法给已安装的用户发布
#    更新（新密钥签的包覆盖不上，只能卸载重装，应用数据全没）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        shell: bash
        run: |
          set -euo pipefail

          ALIAS="apc-release"
          # 24 位十六进制随机口令：纯 [0-9a-f]，避免 / + = 之类在 shell 与粘贴环节容易出事的字符。
          PW="$(openssl rand -hex 12)"

          keytool -genkeypair \
            -keystore apc-release.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" -storepass "$PW" -keypass "$PW" \
            -dname "CN=AI Pocket Chat, OU=Personal, O=noctisvexx, L=Changde, ST=Hunan, C=CN"

          # 自检：这一步能读出来，说明 alias 与口令都对，配进 secret 后签名步骤必过。
          keytool -list -keystore apc-release.jks -storepass "$PW" -alias "$ALIAS"

          base64 -w0 apc-release.jks > apc-release.jks.b64
          printf '%s' "$PW" > STORE_PASSWORD.txt
          printf 'alias:    %s\npassword: %s\n' "$ALIAS" "$PW" > README.txt

          echo "keystore 大小: $(wc -c < apc-release.jks) 字节"
          echo "base64 长度:   $(wc -c < apc-release.jks.b64) 字符"
          echo "口令未打印到日志，请从 artifact 取。"

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: apc-release-keystore
          path: |
            apc-release.jks
            apc-release.jks.b64
            STORE_PASSWORD.txt
            README.txt
          retention-days: 3
